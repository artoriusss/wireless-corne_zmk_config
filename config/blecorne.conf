# CONFIG_ZMK_DISPLAY=y

# Optional second-order latency knob. ZMK default is 5ms press / 5ms release.
# Lowering press debounce shaves real keystroke latency, but too low can cause
# double-fires on worn switches. Enable only if typing still feels laggy after
# the tap-hold flavor fix; revert if you see doubled letters.
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=2
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
